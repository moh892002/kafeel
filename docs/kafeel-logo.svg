<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="كفيل — Kafeel">
  <defs>
    <linearGradient id="kafeel-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b7c86" />
      <stop offset="1" stop-color="#054b52" />
    </linearGradient>
  </defs>

  <!-- Rounded square in the brand teal -->
  <rect width="256" height="256" rx="56" fill="url(#kafeel-bg)" />

  <!-- Heart (care) -->
