# Kafeel — SPA + API reverse proxy (single nginx container).
# The frontend calls relative /api/** paths, so the backend lives behind the
# same origin — no CORS, no VITE_API_URL needed.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # --- Basic hardening headers ---
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # --- Compression (the bundle is Arabic-heavy text) ---
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml application/xml;
    gzip_min_length 1024;

    # --- API: pass the request through unchanged. The backend controllers are
    #     mapped at /api/**, so the full original URI must reach it as-is. ---
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # --- Vite emits content-hashed assets under /assets/ → cache forever ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- SPA routing: every other path falls back to index.html ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
